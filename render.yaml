version: 1

# Define o Disco Persistente (Sua estrutura está perfeita)
disks:
  - name: chroma-storage
    mountPath: /var/data/chroma_db
    sizeGB: 1

services:
  # Serviço 1: O Aplicativo Web Streamlit
  - type: web
    name: assistente-web
    env: python
    plan: free # (Sua ótima adição)
    region: oregon # (Sua ótima adição)
    branch: main
    pythonVersion: "3.11"  # <-- CORREÇÃO 1: Deve ser uma string
    buildCommand: "pip install -r requirements.txt"
    # (Seu startCommand mais robusto - perfeito!)
    startCommand: "streamlit run streamlit_app.py --server.port=10000 --server.address=0.0.0.0"
    envVars:
      - key: PORT # Garante que o Render saiba qual porta expor
        value: 10000
    envVarGroups:
      - name: api_key_rag # <-- CORREÇÃO 2: Apenas referenciamos o grupo da UI
    disk: # <-- CORREÇÃO 3: 'disk' (singular) e apenas anexa, não redefine
      name: chroma-storage
      mountPath: /var/data/chroma_db

  # Serviço 2: O Bot do Telegram
  - type: worker
    name: assistente-telegram
    env: python
    plan: free # (Sua ótima adição)
    region: oregon # (Sua ótima adição)
    branch: main
    pythonVersion: "3.11"  # <-- CORREÇÃO 1: Deve ser uma string
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python telegram_bot.py"
    envVarGroups:
      - name: api_key_rag # <-- CORREÇÃO 2: Apenas referenciamos o grupo da UI
    disk: # <-- CORREÇÃO 3: 'disk' (singular) e apenas anexa
      name: chroma-storage
      mountPath: /var/data/chroma_db