version: 1

# Define o Disco Persistente (DEVE vir ANTES dos serviços)
disks:
  - name: chroma-storage
    sizeGB: 1
    mountPath: /var/data/chroma_db

services:
  # Serviço 1: O Aplicativo Web Streamlit
  - type: web
    name: assistente-web
    env: python
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port=10000 --server.address=0.0.0.0
    envVars:
      - key: PORT
        value: 10000
      - key: STREAMLIT_SERVER_PORT
        value: 10000
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
    envVarGroups:
      - name: chaves-rag
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
      sizeGB: 1
    autoDeploy: true

  # Serviço 2: O Bot do Telegram
  - type: worker
    name: assistente-telegram
    env: python
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVarGroups:
      - name: chaves-rag
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
      sizeGB: 1
    autoDeploy: true