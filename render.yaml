version: 1

services:
  # Serviço 1: O Aplicativo Web Streamlit
  - type: web
    name: assistente-web
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port=10000 --server.address=0.0.0.0
    envVars:
      - key: PORT
        value: 10000
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
      sizeGB: 1
    autoDeploy: true

  # Serviço 2: O Bot do Telegram
  - type: worker
    name: assistente-telegram
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
      sizeGB: 1
    autoDeploy: true