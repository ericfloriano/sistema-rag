version: 1

# Define o disco persistente (para armazenar dados entre deploys)
disks:
  - name: chroma-storage
    mountPath: /var/data/chroma_db
    sizeGB: 1

envVarGroups:
  # Grupo de variáveis de ambiente compartilhadas entre os serviços
  - name: api_key_rag
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        value: "seu_token_telegram_aqui"
      - key: OPENAI_API_KEY
        value: "sua_chave_openai_aqui"
      - key: GEMINI_API_KEY
        value: "sua_chave_gemini_aqui"

services:
  # Serviço 1: Aplicativo Web (Streamlit)
  - type: web
    name: assistente-web
    env: python
    plan: free
    region: oregon
    branch: main
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port=$PORT --server.address=0.0.0.0
    envVarGroups:
      - api_key_rag
    disks:
      - name: chroma-storage
        mountPath: /var/data/chroma_db

  # Serviço 2: Bot do Telegram
  - type: worker
    name: assistente-telegram
    env: python
    plan: free
    region: oregon
    branch: main
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVarGroups:
      - api_key_rag
    disks:
      - name: chroma-storage
        mountPath: /var/data/chroma_db
