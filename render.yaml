version: 1

services:
  # Serviço 1: O Aplicativo Web Streamlit
  - type: web # Tipo: Web Service
    name: assistente-web # Nome do serviço
    env: python # FORÇA O AMBIENTE PYTHON
    pythonVersion: "3.11" # <-- CORREÇÃO 1: "python" com "o"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run streamlit_app.py"
    envVars:
      - key: STREAMLIT_SERVER_PORT
        value: 10000
    envVarGroups:
      - name: chaves-rag # <-- CORREÇÃO 2: Movido para dentro do serviço
    disks:
      - name: chroma-storage # Conecta o disco
        mountPath: /var/data/chroma_db # No caminho correto
    autoDeploy: true

  # Serviço 2: O Bot do Telegram
  - type: worker # Tipo: Background Worker
    name: assistente-telegram # Nome do serviço
    env: python # FORÇA O AMBIENTE PYTHON
    pythonVersion: "3.11" # <-- CORREÇÃO 1: "python" com "o"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python telegram_bot.py"
    envVarGroups:
      - name: chaves-rag # <-- CORREÇÃO 2: Movido para dentro do serviço
    disks:
      - name: chroma-storage # Conecta o MESMO disco
        mountPath: /var/data/chroma_db # No MESMO caminho
    autoDeploy: true

# Define o Disco Persistente (no topo do arquivo)
disks:
  - name: chroma-storage # Nome do disco
    sizeGB: 1 # Tamanho do disco
    mountPath: /var/data/chroma_db # Onde o "cérebro" será salvo