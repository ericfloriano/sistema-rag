version: 1

# Define o Disco Persistente
disks:
  - name: chroma-storage
    mountPath: /var/data/chroma_db
    sizeGB: 1

services:
  # Serviço 1: O Aplicativo Web Streamlit
  - type: web
    name: assistente-web
    runtime: python # <-- CORREÇÃO: 'env: python' não existe, use 'runtime'
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port=10000 --server.address=0.0.0.0
    envVars:
      - key: PORT
        value: 10000
    envVarGroups:
      - api_key_rag # <-- CORREÇÃO: Referência direta, sem 'name:'
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
    autoDeploy: true

  # Serviço 2: O Bot do Telegram
  - type: worker
    name: assistente-telegram
    runtime: python # <-- CORREÇÃO: 'env: python' não existe, use 'runtime'
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVarGroups:
      - api_key_rag # <-- CORREÇÃO: Referência direta, sem 'name:'
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db
    autoDeploy: true